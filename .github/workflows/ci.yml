name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --silent

      - name: Build (webpack production bundle)
        run: npm run compile

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-20
          path: dist/
          if-no-files-found: ignore

      - name: Package VSIX
        run: |
          mkdir -p artifacts
          npx --yes @vscode/vsce package --no-yarn --out artifacts/sftp-${{ github.ref_name }}-${{ github.run_number }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vsix
          path: artifacts/*.vsix
          if-no-files-found: error
